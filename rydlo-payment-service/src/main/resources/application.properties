spring.application.name=rydlo-payment-service
server.port=8081

# DB config
spring.datasource.url=jdbc:mysql://localhost:3306/rydlo_payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=shashank
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
